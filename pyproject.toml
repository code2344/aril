[project]
name = "aril"
version = "0.1.0"
description = "Lossless text compression with a byte-level language model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.16.0",
    "huggingface-hub==2.4.0",
    "safetensors==0.8.0",
    "torch==2.15.0",
    "tqdm==4.70.1",
    "transformers==5.23.0",
]

[project.scripts]
aril = "aril.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
